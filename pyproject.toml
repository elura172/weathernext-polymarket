[project]
name = "weathernext-polymarket"
version = "0.1.0"
description = "DeepMind WeatherNext 3 forecasting, probabilistic bracket pricing, and depth-aware execution engine for Polymarket prediction markets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "tabulate>=0.9.0",
    "py-clob-client>=0.20.0",
    "eth-account>=0.11.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
